# NightGuard - disisipkan ke setiap server block panel oleh installer.
include /etc/nginx/nightguard/deny.conf;
include /etc/nginx/nightguard/profile.conf;

# Log khusus yang dibaca daemon untuk mendeteksi penyerang.
error_log /var/log/nginx/nightguard.log error;

# Tahan koneksi lambat/menggantung (Slowloris).
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;
