# NightGuard - zona rate limit (context http). Dipasang ke /etc/nginx/conf.d/nightguard-zones.conf
# Jangan ubah nama zona/variabel; ubah angka rate di sini atau burst di profile-*.conf.

# IP yang dikecualikan dari semua pembatasan (admin, node Wings, server sendiri).
# Daftarnya dibuat otomatis oleh NightGuard dari WHITELIST + node di database panel.
geo $ng_wl {
    default 0;
    include /etc/nginx/nightguard/whitelist.list;
}

# Kunci pembatasan. Kunci kosong = tidak dibatasi.
# - /api/remote/ (lalu lintas Wings -> Panel) punya zona sendiri yang jauh lebih longgar.
map "$ng_wl:$request_uri" $ng_req_key {
    "~^1:"             "";
    "~^0:/api/remote/" "";
    default            $binary_remote_addr;
}
map "$ng_wl:$request_uri" $ng_remote_key {
    "~^1:"             "";
    "~^0:/api/remote/" $binary_remote_addr;
    default            "";
}
# Percobaan login / reset password: hanya POST yang dihitung.
map "$ng_wl:$request_method:$request_uri" $ng_login_key {
    "~^1:"                              "";
    "~^0:POST:/auth/(login|password)"   $binary_remote_addr;
    default                             "";
}

limit_req_zone  $ng_req_key    zone=ng_req:20m    rate=20r/s;   # mode normal
limit_req_zone  $ng_req_key    zone=ng_strict:20m rate=5r/s;    # mode serangan
limit_req_zone  $ng_remote_key zone=ng_remote:10m rate=100r/s;
limit_req_zone  $ng_login_key  zone=ng_login:10m  rate=6r/m;
limit_conn_zone $ng_req_key    zone=ng_conn:20m;

limit_req_status  429;
limit_conn_status 429;
