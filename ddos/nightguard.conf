# NightGuard - konfigurasi. Setelah mengubah, perubahan terbaca otomatis dalam ~1 menit
# (atau: systemctl restart nightguard). Pantau: nightguard status | tail -f /var/log/nightguard.log

PANEL_DIR="/var/www/pterodactyl"
INTERVAL=5                 # detik per siklus pemeriksaan

# ---- Ambang auto-deteksi serangan (kalau salah satu terlampaui -> mode ketat) ----
TOTAL_CONN_ATTACK=700      # total koneksi aktif ke port 80/443
SYN_RECV_ATTACK=150        # koneksi setengah jadi (SYN flood)
OFFENDERS_ATTACK=15        # jumlah IP yang sedang kena rate-limit bersamaan
EVENTS_ATTACK=400          # jumlah penolakan rate-limit per siklus

# ---- Pemblokiran per IP ----
CONN_PER_IP_BAN=80         # koneksi simultan dari satu IP -> blokir
HIT_BAN=100                # skor penolakan rate-limit (meluruh) -> blokir
BAN_TIMES="3600 21600 86400 604800"   # 1 jam, 6 jam, 1 hari, 7 hari (naik kalau mengulang)
MAX_BANS_PER_CYCLE=300

# ---- Kembali ke mode normal ----
CALM_CYCLES=12             # siklus tenang berturut-turut
MIN_ATTACK_HOLD=120        # detik minimum bertahan di mode ketat

# ---- Pengecualian ----
# IP / CIDR yang tidak pernah dibatasi atau diblokir (pisahkan spasi). IP node Wings
# dan IP server ini diambil otomatis, tidak perlu ditulis di sini.
WHITELIST="127.0.0.1 ::1"

# ---- Lain-lain ----
BAN_BACKEND="ipset"        # ipset = blokir di firewall | nginx = daftar deny di nginx
CF_MODE="false"            # true = panel di belakang Cloudflare
DISCORD_WEBHOOK=""         # opsional: kirim notifikasi serangan ke Discord
CF_API_TOKEN=""            # opsional: otomatis aktifkan "Under Attack Mode" Cloudflare
CF_ZONE_ID=""              #   (token perlu izin Zone Settings: Edit)
